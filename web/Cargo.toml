[package]
name = "wepaper-web"
description = "Web wallpapers for wepaper: a renderer plugin on WebKitGTK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wepaper-json.workspace = true
wepaper-ipc.workspace = true
# v4_12 brings in v4_10, where the bindings keep the accessibility interface that
# WebKit's view implements; without it webkit6 does not build.
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
lexopt = "0.3"
webkit6 = "0.6"

[lints]
workspace = true
