[workspace]
resolver = "3"
members = ["engine", "ipc", "json", "web"]
default-members = [".", "engine", "ipc", "json"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-2.0-or-later"
repository = "https://github.com/MoonTiwzy/wepaper"
authors = ["MoonTiwzy"]

[workspace.dependencies]
wepaper-engine = { path = "engine", version = "0.1.0" }
wepaper-ipc = { path = "ipc", version = "0.1.0" }
wepaper-json = { path = "json", version = "0.1.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lead_build)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[package]
name = "wepaper"
description = "Wallpaper Engine wallpapers as the Wayland desktop background."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["wayland", "wallpaper", "wallpaper-engine", "layer-shell"]
categories = ["command-line-utilities", "graphics"]

[features]
default = ["script"]
# SceneScript (QuickJS). Without it scenes play, their scripts do not run.
script = ["wepaper-engine/script"]

[dependencies]
wepaper-engine.workspace = true
wepaper-ipc.workspace = true
wepaper-json.workspace = true
glow = "0.16"
lexopt = "0.3"
libc = "0.2"
log = "0.4"
png = "0.17"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"

[lints]
workspace = true

[profile.release]
lto = "thin"
panic = "abort"
strip = true
